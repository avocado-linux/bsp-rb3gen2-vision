default_target: rb3gen2
supported_targets:
  - rb3gen2

extensions:
  # The core-kit BSP this layers on. Declared with a package source so the
  # resolver knows to fetch it from the target's extension feed; a bare
  # `depends_on` name that is not defined here fails with "not defined in
  # `extensions:` and could not be resolved from the target's feed".
  avocado-bsp-rb3gen2:
    source:
      type: package
      version: "*"

  avocado-bsp-rb3gen2-vision:
    version: 0.1.0
    release: r0
    types:
      - sysext
      - confext
    summary: "RB3 Gen 2 Vision Mezzanine — CAMSS ISP and the IMX577 sensor"
    description: >
      Board support for the camera mezzanine of the Qualcomm Robotics RB3 Gen 2
      Vision Kit. Layers on top of avocado-bsp-rb3gen2, which covers the core
      kit; this extension adds only what the mezzanine itself brings.
    vendor: "Avocado Linux"
    license: "MIT"

    # The core kit is a separate extension on purpose.
    #
    # The RB3 Gen 2 ships as a core kit plus one of several mezzanines, and the
    # mezzanine is what varies between products. Same split as the EXMP-Q911,
    # where the module is the MACHINE and the EXCC carrier is an extension:
    # anything that is a property of the removable board belongs here, not in
    # the machine conf, or every product needs its own machine.
    #
    # So this extension holds the camera stack and nothing else. Ethernet,
    # wifi, and the QPS615 are core-kit parts and live in avocado-bsp-rb3gen2.
    depends_on:
      - avocado-bsp-rb3gen2

    packages:
      # --- CAMSS, the SoC's camera subsystem -----------------------------
      # The ISP itself. Present on every sc7280/QCS6490, but nothing enables
      # it without a sensor to feed it, which is why it is here and not in the
      # core-kit extension.
      kernel-module-qcom-camss: '*'
      # CAMSS's own clock controller. Without it camss probes and then fails
      # to get its clocks.
      kernel-module-camcc-sc7280: '*'

      # --- The sensor ----------------------------------------------------
      # The Vision Mezzanine's camera is a Sony IMX577, declared in the
      # overlay as `compatible = "sony,imx577"`. There is no imx577 module:
      # the in-tree imx412 driver claims both parts --
      #
      #   drivers/media/i2c/imx412.c:
      #     { .compatible = "sony,imx412", .data = "imx412" },
      #     { .compatible = "sony,imx577", .data = "imx577" },
      #
      # -- so imx412 IS the IMX577 driver. Checked in the kernel source for
      # this build, not assumed from the name.
      kernel-module-imx412: '*'

      # --- V4L2 core -----------------------------------------------------
      # What camss and the sensor bind against, and what creates /dev/video*
      # and /dev/media*. Modular in this kernel, so each one is named.
      kernel-module-videodev: '*'
      kernel-module-mc: '*'
      kernel-module-v4l2-fwnode: '*'
      kernel-module-v4l2-async: '*'
      kernel-module-v4l2-mem2mem: '*'
      kernel-module-videobuf2-common: '*'
      kernel-module-videobuf2-v4l2: '*'
      kernel-module-videobuf2-memops: '*'
      kernel-module-videobuf2-dma-sg: '*'

      # --- Userspace -----------------------------------------------------
      # media-ctl is how you inspect and link the camss pipeline; v4l-utils
      # brings v4l2-ctl. Both are the minimum for proving a sensor streams.
      media-ctl: '*'
      v4l-utils: '*'

    # Load order matters: the V4L2 core and the clock controller must be up
    # before camss probes, and camss before the sensor is useful.
    modprobe:
      - videodev
      - videobuf2_dma_sg
      - camcc_sc7280
      - qcom_camss
      - imx412

    on_merge:
      - udevadm control --reload
      - udevadm trigger --type=subsystems --action=add --settle
      - udevadm trigger --type=devices --action=add --settle

    # The mezzanine's device tree.
    #
    # overlays/qcs6490-rb3gen2-vision-mezzanine.dtso is upstream meta-qcom's,
    # carried verbatim. It sets `&camss status = "okay"`, `&cci1 status =
    # "okay"`, and declares the imx577 on cci1_i2c1. Without it the base DTB
    # describes no camss and no sensor, and the packages above have nothing to
    # bind to -- verified on hardware: no camss node, no /dev/video*, no
    # /dev/media*.
    #
    # DELIBERATELY NOT DECLARED YET, for the same two reasons as
    # bsp-excc-q911's carrier overlay:
    #
    #   1. Declaring device_tree_overlays pulls in avocado-dtc-overlay-deliver,
    #      which this feed does not carry for this target -- `avocado install`
    #      fails with "No match for argument: avocado-dtc-overlay-deliver".
    #   2. Even with delivery, the Qualcomm flow flashes ONE dtb to dtb_a and
    #      has no overlay-application step, so it would have no effect.
    #
    # The .dtso is kept because it is the real description of the mezzanine,
    # and because the merge is already proven: `fdtoverlay -i
    # qcs6490-rb3gen2.dtb -o merged.dtb qcs6490-rb3gen2-vision-mezzanine.dtbo`
    # applies cleanly against this build's base DTB (+765 bytes). What is
    # missing is a flow that does that merge and flashes the result.
    #
    # Re-enable once overlay delivery AND application both exist here.
    #
    # device_tree_overlays:
    #   - name: qcs6490-rb3gen2-vision-mezzanine
    #     src: overlays/qcs6490-rb3gen2-vision-mezzanine.dtso

sdk:
  image: docker.io/avocadolinux/sdk:{{ env.AVOCADO_DISTRO_RELEASE }}

  # mkfs.erofs, which `avocado ext image` shells out to. Not in the SDK
  # bootstrap, and an extension declaring no sdk.packages gets bootstrap only.
  packages:
    nativesdk-erofs-utils: "*"
